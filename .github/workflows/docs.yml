name: Build and Deploy Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'README.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-docs

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd docs
          npm ci

      - name: Copy README to content
        run: |
          cd docs
          # Create repo.md with frontmatter
          cat > content/repo.md << 'EOF'
          +++
          title = "Repository"
          description = "Main repository README documentation"
          SequenceNumber = 7
          +++
          
          EOF
          # Append README content
          cat ../README.md >> content/repo.md

      - name: Generate Rust documentation
        run: |
          echo "::group::Building Rust docs for latreclib"
          cd firmware/latreclib
          cargo doc --no-deps --all-features
          cd ../..
          echo "::endgroup::"
          
          # Copy to docs directory
          mkdir -p docs/public/docs-api/firmware
          if [ -d "firmware/latreclib/target/doc" ]; then
            cp -r firmware/latreclib/target/doc/* docs/public/docs-api/firmware/
            echo "✅ Rust docs copied successfully"
          else
            echo "⚠️ Warning: Rust docs not found"
          fi

      - name: Generate Flutter documentation
        run: |
          echo "::group::Building Flutter docs"
          cd gui
          flutter pub get
          dart doc --output ../docs/public/docs-api/gui || echo "⚠️ Dart doc failed, checking for existing docs..."
          cd ..
          echo "::endgroup::"
          
          # Check if docs were generated
          if [ ! -d "docs/public/docs-api/gui/index.html" ] && [ -d "gui/doc/api" ]; then
            echo "Using existing Flutter docs from gui/doc/api"
            cp -r gui/doc/api/* docs/public/docs-api/gui/
          fi

      - name: Build Next.js site
        run: |
          cd docs
          npm run build
          
          # Copy API docs to out directory
          if [ -d "public/docs-api" ]; then
            cp -r public/docs-api out/
            echo "✅ API docs copied to output"
          fi
          
          # Verify ZIP files were created
          if [ -f "out/flutter-dart-docs.zip" ]; then
            echo "✅ Flutter docs ZIP created: $(du -h out/flutter-dart-docs.zip | cut -f1)"
          else
            echo "⚠️ Flutter docs ZIP not found"
          fi
          
          if [ -f "out/rust-firmware-docs.zip" ]; then
            echo "✅ Rust docs ZIP created: $(du -h out/rust-firmware-docs.zip | cut -f1)"
          else
            echo "⚠️ Rust docs ZIP not found"
          fi
          
      - name: Create .nojekyll file
        run: |
          cd docs
          touch out/.nojekyll
          
      - name: Test documentation routes
        run: |
          cd docs
          # Start server
          npx serve out -p 3000 --no-port-switching &
          SERVER_PID=$!
          
          # Wait for server
          sleep 5
          
          # Test main routes
          echo "::group::Testing main routes"
          for route in "/" "/developers" "/hackathon" "/api-docs"; do
            if curl -f -s -o /dev/null "http://localhost:3000${route}"; then
              echo "✅ ${route}"
            else
              echo "❌ ${route} failed"
              exit 1
            fi
          done
          echo "::endgroup::"
          
          # Test API documentation
          echo "::group::Testing API documentation"
          if curl -f -s -o /dev/null "http://localhost:3000/docs-api/firmware/latreclib/index.html"; then
            echo "✅ Rust API docs"
          else
            echo "❌ Rust API docs not accessible"
          fi
          
          if curl -f -s -o /dev/null "http://localhost:3000/docs-api/gui/index.html"; then
            echo "✅ Flutter API docs"
          else
            echo "❌ Flutter API docs not accessible"
          fi
          echo "::endgroup::"
          
          # Kill server
          kill $SERVER_PID || true
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4