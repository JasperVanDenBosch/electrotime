name: Build and Deploy Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'README.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-docs

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd docs
          npm ci

      - name: Copy README to content
        run: |
          cd docs
          # Create repo.md with frontmatter
          cat > content/repo.md << 'EOF'
          +++
          title = "Repository"
          description = "Main repository README documentation"
          SequenceNumber = 7
          +++
          
          EOF
          # Append README content
          cat ../README.md >> content/repo.md

      - name: Generate Rust documentation
        run: |
          echo "::group::Building Rust docs"
          
          # Temporarily rename .cargo/config.toml files to avoid AVR target issues
          echo "Temporarily disabling AVR configurations..."
          for config in firmware/.cargo/config.toml firmware/*/.cargo/config.toml; do
            if [ -f "$config" ]; then
              mv "$config" "$config.bak"
              echo "Disabled: $config"
            fi
          done
          
          # Build docs for latreclib
          echo "Building docs for latreclib..."
          cd firmware/latreclib
          cargo doc --no-deps --all-features
          cd ../..
          
          # Restore .cargo/config.toml files
          echo "Restoring AVR configurations..."
          for config in firmware/.cargo/config.toml.bak firmware/*/.cargo/config.toml.bak; do
            if [ -f "$config" ]; then
              mv "$config" "${config%.bak}"
              echo "Restored: ${config%.bak}"
            fi
          done
          
          echo "::endgroup::"
          
          # Copy to docs directory
          mkdir -p docs/public/docs-api/firmware
          if [ -d "firmware/latreclib/target/doc" ]; then
            cp -r firmware/latreclib/target/doc/* docs/public/docs-api/firmware/
            echo "✅ Rust docs copied successfully"
          else
            echo "⚠️ Warning: Rust docs not found"
          fi

      - name: Generate Flutter documentation
        run: |
          echo "::group::Building Flutter docs"
          cd gui
          flutter pub get
          dart doc --output ../docs/public/docs-api/gui || echo "⚠️ Dart doc failed, checking for existing docs..."
          cd ..
          echo "::endgroup::"
          
          # Check if docs were generated
          if [ ! -d "docs/public/docs-api/gui/index.html" ] && [ -d "gui/doc/api" ]; then
            echo "Using existing Flutter docs from gui/doc/api"
            cp -r gui/doc/api/* docs/public/docs-api/gui/
          fi

      - name: Build Next.js site
        run: |
          cd docs
          npm run build
          
          # Copy API docs to out directory
          if [ -d "public/docs-api" ]; then
            cp -r public/docs-api out/
            echo "✅ API docs copied to output"
          fi
          
          # Verify ZIP files were created
          if [ -f "out/flutter-dart-docs.zip" ]; then
            echo "✅ Flutter docs ZIP created: $(du -h out/flutter-dart-docs.zip | cut -f1)"
          else
            echo "⚠️ Flutter docs ZIP not found"
          fi
          
          if [ -f "out/rust-firmware-docs.zip" ]; then
            echo "✅ Rust docs ZIP created: $(du -h out/rust-firmware-docs.zip | cut -f1)"
          else
            echo "⚠️ Rust docs ZIP not found"
          fi
          
      - name: Create .nojekyll file
        run: |
          cd docs
          touch out/.nojekyll
          
      - name: Verify build output
        run: |
          cd docs
          echo "::group::Checking generated files"
          echo "Contents of out directory:"
          ls -la out/
          echo ""
          echo "Checking for key HTML files:"
          # Check for main pages
          for page in "index.html" "developers/index.html" "hackathon/index.html" "api-docs/index.html"; do
            if [ -f "out/$page" ]; then
              echo "✅ $page exists"
            else
              echo "⚠️  $page not found"
            fi
          done
          echo ""
          echo "Checking for API documentation:"
          # Check for API docs
          if [ -d "out/docs-api/firmware" ]; then
            echo "✅ Firmware API docs directory exists"
          else
            echo "⚠️  Firmware API docs directory not found"
          fi
          if [ -d "out/docs-api/gui" ]; then
            echo "✅ Flutter API docs directory exists"
          else
            echo "⚠️  Flutter API docs directory not found"
          fi
          echo ""
          echo "Checking for ZIP files:"
          if [ -f "out/flutter-dart-docs.zip" ]; then
            echo "✅ Flutter docs ZIP exists ($(du -h out/flutter-dart-docs.zip | cut -f1))"
          else
            echo "⚠️  Flutter docs ZIP not found"
          fi
          if [ -f "out/rust-firmware-docs.zip" ]; then
            echo "✅ Rust docs ZIP exists ($(du -h out/rust-firmware-docs.zip | cut -f1))"
          else
            echo "⚠️  Rust docs ZIP not found"
          fi
          echo "::endgroup::"
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4