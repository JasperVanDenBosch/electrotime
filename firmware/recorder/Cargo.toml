[package]
name = "recorder"
version = "0.1.0"
edition = "2021"
authors = ["Jasper van den Bosch <japsai@gmail.com>"]
license = "MIT"

[[bin]]
name = "recorder"
test = false
bench = false

[dependencies]
panic-halt = "0.2.0"
ufmt = "0.2.0"
nb = "0.1.2"
embedded-hal = "0.2.3"

[dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "21342dcace7184f01fdc4e9703b01197bd4b4b4f"
features = ["arduino-uno"]

[dependencies.latreclib]
path = "../latreclib"

# Configure the build for maximum performance - timing precision is critical
[profile.dev]
panic = "abort"
lto = true
opt-level = 2        # Use level 2 to avoid compiler bugs
codegen-units = 1

[profile.release]
panic = "abort"
lto = true
opt-level = 2        # Use level 2 to avoid compiler bugs  
codegen-units = 1
debug = true
