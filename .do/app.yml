alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
name: electrotime-docs
region: lon
domains:
- domain: electrotime.org
  type: PRIMARY
  zone: electrotime.org
- domain: www.electrotime.org
  type: ALIAS
  zone: electrotime.org
services:
- name: docs
  http_port: 80
  instance_count: 1
  instance_size_slug: basic-xxs
  image:
    registry_type: GHCR
    registry: jaspervandenbosch
    repository: electrotime-org
    digest: ${IMAGE_DIGEST}
  health_check:
    initial_delay_seconds: 5
    period_seconds: 10
    timeout_seconds: 1
    success_threshold: 1
    failure_threshold: 5
    http_path: /
